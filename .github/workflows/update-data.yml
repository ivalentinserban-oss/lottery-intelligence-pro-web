name: Update lottery results

# Downloads the latest official results, cross-checks the sources and commits any new drawings.
# Powerball draws Mon/Wed/Sat 10:59 pm ET, Mega Millions Tue/Fri 11:00 pm ET.
on:
  schedule:
    - cron: "40 5 * * *"   # ~1:40 am ET — shortly after the drawings
    - cron: "15 14 * * *"  # ~10:15 am ET — picks up sources that publish in the morning
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and verify results
        run: node scripts/update-data.js
      - name: Run tests
        run: node --test
      - name: Commit new drawings
        run: |
          if git diff --quiet -- data; then
            echo "No new results."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update lottery results"
          git push
